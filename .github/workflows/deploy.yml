name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/glimpse-app-improvements-oiawk5
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement lets the workflow turn Pages on itself rather than needing a
      # manual trip to repo settings. It cannot override a plan restriction:
      # Pages from a *private* repo requires a paid GitHub plan.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Phase 0 is static: the spike needs no build step. When the Vite app
      # lands in Phase 1 this gains a node setup + `npm ci && npm run build`
      # and the upload path changes to ./dist.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
