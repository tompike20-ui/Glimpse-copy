<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    a { color: #ffb020; } a:hover { color: #f0a01c; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #000; color: #fff; letter-spacing: -0.022em; display: flex; flex-direction: column; overflow: hidden;">

  <!-- viewfinder: no brand colour on the image itself -->
  <div style="flex: 1; min-height: 0; position: relative; display: grid; place-items: center; background: linear-gradient(165deg, #24303a, #3f5464 45%, #1a232b);">

    <!-- everything outside the chosen shape dims, so what you see is what you get -->
    <div style="position: absolute; inset: 0; box-shadow: inset 0 96px 0 rgba(0,0,0,0.5), inset 0 -96px 0 rgba(0,0,0,0.5);"></div>

    <div style="position: absolute; top: 50px; left: 12px; min-height: 44px; display: flex; align-items: center; gap: 2px; font-size: 17px; color: #fff;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>
      Done
    </div>

    <div style="position: absolute; top: 58px; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 999px; background: rgba(0,0,0,0.62); font-size: 13px; font-weight: 500;">12 moments · 96 BPM</div>

    <div style="position: absolute; top: 50px; right: 12px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.15); display: grid; place-items: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
    </div>

    <!-- last moment, so you can see what you just caught without leaving -->
    <div style="position: absolute; left: 16px; bottom: 16px; width: 52px; height: 52px; border-radius: 11px; background: linear-gradient(150deg,#4a3220,#8a4a1e); box-shadow: 0 0 0 2px rgba(255,255,255,0.85);"></div>
  </div>

  <div style="flex: none; background: #000; padding: 14px 0 34px;">

    <!-- mic level: silent audio is the defect this app exists to prevent -->
    <div style="margin: 0 28px 14px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.18); overflow: hidden;">
      <div style="width: 42%; height: 100%; background: #30d158;"></div>
    </div>

    <div style="display: flex; justify-content: center; gap: 22px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: rgba(255,255,255,0.5); padding-bottom: 16px;">
      <span style="color: #ffb020;">1s</span><span>2s</span><span>3s</span><span>5s</span>
    </div>

    <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 28px;">
      <div style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.15); display: grid; place-items: center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5A8.5 8.5 0 0 1 18 6.4"/><path d="M20.5 14.5A8.5 8.5 0 0 1 6 17.6"/><path d="M18 3v3.6h-3.6M6 21v-3.6h3.6"/></svg>
      </div>

      <div style="justify-self: center; position: relative; width: 78px; height: 78px;">
        <svg width="78" height="78" viewBox="0 0 78 78" style="position: absolute; inset: 0; transform: rotate(-90deg);">
          <circle cx="39" cy="39" r="36" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3.5"/>
          <circle cx="39" cy="39" r="36" fill="none" stroke="#ffb020" stroke-width="3.5" stroke-dasharray="226" stroke-dashoffset="158" stroke-linecap="round"/>
        </svg>
        <div style="position: absolute; inset: 9px; border-radius: 50%; background: #ff453a;"></div>
      </div>

      <div style="justify-self: end; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.15); display: grid; place-items: center; opacity: 0.35;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
