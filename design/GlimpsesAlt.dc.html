<x-dc>

    <div>
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px 9px;">

        <div style="font-size: 12px; color: rgba(235,235,245,0.6); font-variant-numeric: tabular-nums;">22 · 0:22</div>
