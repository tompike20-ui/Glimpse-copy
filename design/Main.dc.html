<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    a { color: #ffb020; } a:hover { color: #f0a01c; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #000; color: #fff; letter-spacing: -0.022em; display: flex; flex-direction: column; overflow: hidden;">

  <!-- nav -->
  <div style="padding: 56px 16px 0; display: flex; flex-direction: column; gap: 2px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <div style="font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 41px;">Glimpses</div>
      <div style="width: 44px; height: 44px; border-radius: 22px; background: linear-gradient(160deg, #f0a01c, #d24b16); display: grid; place-items: center; margin-bottom: 2px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>
    <div style="font-size: 13px; color: rgba(235,235,245,0.6);">4 Glimpses · 3 min 12 sec of footage</div>
  </div>

  <!-- poster cards: the footage leads, not a text row -->
  <div style="flex: 1; overflow: hidden; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 14px;">

    <div style="position: relative; height: 208px; border-radius: 18px; overflow: hidden; background: linear-gradient(150deg, #3b2a1d, #6b3b1c 55%, #23160d);">
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.15) 52%, rgba(0,0,0,0.3) 100%);"></div>
      <!-- moment count as a strip of ticks: the Glimpse is made of pieces -->
      <div style="position: absolute; top: 14px; left: 14px; display: flex; gap: 3px;">
        <div style="width: 15px; height: 3px; border-radius: 2px; background: #ffb020;"></div>
        <div style="width: 15px; height: 3px; border-radius: 2px; background: #ffb020;"></div>
        <div style="width: 15px; height: 3px; border-radius: 2px; background: #ffb020;"></div>
        <div style="width: 15px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.32);"></div>
        <div style="width: 15px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.32);"></div>
      </div>
      <div style="position: absolute; top: 12px; right: 12px; padding: 4px 9px; border-radius: 999px; background: rgba(0,0,0,0.5); font-size: 11px; font-weight: 600;">1:04</div>
      <div style="position: absolute; left: 16px; right: 16px; bottom: 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
        <div style="min-width: 0;">
          <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em;">Weekend in Rome</div>
          <div style="font-size: 13px; color: rgba(235,235,245,0.75); margin-top: 2px;">38 moments · Today</div>
        </div>
        <div style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.92); display: grid; place-items: center; flex: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#000"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.87l11-6.8a1 1 0 0 0 0-1.74l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>
        </div>
      </div>
    </div>

    <div style="position: relative; height: 208px; border-radius: 18px; overflow: hidden; background: linear-gradient(150deg, #1d2b30, #26494f 55%, #101c1f);">
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.15) 52%, rgba(0,0,0,0.3) 100%);"></div>
      <div style="position: absolute; top: 14px; left: 14px; display: flex; gap: 3px;">
        <div style="width: 15px; height: 3px; border-radius: 2px; background: #ffb020;"></div>
        <div style="width: 15px; height: 3px; border-radius: 2px; background: #ffb020;"></div>
        <div style="width: 15px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.32);"></div>
        <div style="width: 15px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.32);"></div>
        <div style="width: 15px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.32);"></div>
      </div>
      <div style="position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; align-items: center;">
        <div style="padding: 4px 9px; border-radius: 999px; background: rgba(0,0,0,0.5); display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="4.5" y="10" width="15" height="10.5" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg>
          Locked
        </div>
        <div style="padding: 4px 9px; border-radius: 999px; background: rgba(0,0,0,0.5); font-size: 11px; font-weight: 600;">0:22</div>
      </div>
      <div style="position: absolute; left: 16px; right: 16px; bottom: 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
        <div style="min-width: 0;">
          <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em;">A second a day</div>
          <div style="font-size: 13px; color: rgba(235,235,245,0.75); margin-top: 2px;">22 moments · Yesterday</div>
        </div>
        <div style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.92); display: grid; place-items: center; flex: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#000"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.87l11-6.8a1 1 0 0 0 0-1.74l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>
        </div>
      </div>
    </div>

    <div style="position: relative; height: 208px; border-radius: 18px; overflow: hidden; background: linear-gradient(150deg, #2a2233, #4b3660 55%, #17121d);">
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.15) 52%, rgba(0,0,0,0.3) 100%);"></div>
      <div style="position: absolute; left: 16px; bottom: 14px;">
        <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em;">Harry's birthday</div>
        <div style="font-size: 13px; color: rgba(235,235,245,0.75); margin-top: 2px;">9 moments · 12 Mar</div>
      </div>
    </div>

  </div>

  <!-- record is the primary act, so it owns the bottom bar -->
  <div style="flex: none; padding: 12px 16px 34px; display: flex; gap: 10px; align-items: center;">
    <div style="flex: 1; height: 52px; border-radius: 15px; background: linear-gradient(160deg, #f0a01c, #d24b16); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2L9 4h6l1.5 2h2A2.5 2.5 0 0 1 21 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
      New Glimpse
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
