<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    a { color: #ffb020; } a:hover { color: #f0a01c; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #000; color: #fff; letter-spacing: -0.022em; position: relative; overflow: hidden;">

  <!-- the paused frame stays visible: the still you export is the one you see -->
  <div style="position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(150deg, #4a3220, #8a4a1e 55%, #2b1a0f);"></div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.55);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #1c1c1e; border-radius: 16px 16px 0 0; padding: 8px 0 34px;">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: rgba(235,235,245,0.3); margin: 0 auto 16px;"></div>

    <div style="padding: 0 16px 4px;">
      <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em;">Export</div>
      <div style="font-size: 13px; color: rgba(235,235,245,0.6); margin-top: 3px;">Weekend in Rome · 38 moments · 1:04</div>
    </div>

    <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px;">

      <!-- video: the primary act, and the only one that is instant -->
      <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: #2c2c2e; box-shadow: 0 0 0 2px #ffb020;">
        <div style="width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(160deg, #f0a01c, #d24b16); display: grid; place-items: center; flex: none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M8 5v14M16 5v14M3 12h18"/></svg>
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 17px; font-weight: 600;">Whole Glimpse</div>
          <div style="font-size: 13px; color: rgba(235,235,245,0.6); margin-top: 1px;">1080p video · about 96 MB · exports instantly</div>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
      </div>

      <!-- still: the frame under the playhead -->
      <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: #2c2c2e;">
        <div style="width: 46px; height: 46px; border-radius: 12px; background: rgba(120,120,128,0.32); display: grid; place-items: center; flex: none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(235,235,245,0.85)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.5"/><path d="m4 17 4.5-4.5a2 2 0 0 1 2.8 0L16 17"/></svg>
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 17px; font-weight: 600;">This frame</div>
          <div style="font-size: 13px; color: rgba(235,235,245,0.6); margin-top: 1px;">JPEG still at 0:20 · moment 12</div>
        </div>
        <div style="width: 40px; height: 40px; border-radius: 8px; background: linear-gradient(150deg,#4a3220,#8a4a1e); flex: none;"></div>
      </div>

    </div>

    <div style="padding: 18px 16px 0;">
      <div style="font-size: 15px; font-weight: 600; padding-bottom: 9px;">Quality</div>
      <div style="display: flex; background: rgba(120,120,128,0.24); border-radius: 9px; padding: 2px; gap: 2px;">
        <div style="flex: 1; padding: 7px; border-radius: 7px; background: #636366; text-align: center; font-size: 13px; font-weight: 600;">1080p</div>
        <div style="flex: 1; padding: 7px; border-radius: 7px; text-align: center; font-size: 13px; color: rgba(235,235,245,0.6);">720p</div>
      </div>
    </div>

    <div style="padding: 18px 16px 0;">
      <div style="height: 52px; border-radius: 15px; background: linear-gradient(160deg, #f0a01c, #d24b16); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5"/><path d="m8 7 4-3.5L16 7"/><path d="M5 13v5.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V13"/></svg>
        Save to Photos
      </div>
      <div style="text-align: center; font-size: 15px; color: rgba(235,235,245,0.6); padding-top: 14px;">Cancel</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
