<x-dc>

    a { color: #ffb020; } a:hover { color: #f0a01c; }

  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #000; color: #fff; letter-spacing: -0.022em; position: relative; overflow: hidden;">

  <div style="position: absolute; inset: 0; background: #000; opacity: 0.55;"></div>

      <div style="width: 60px; min-height: 44px; display: flex; align-items: center; justify-content: flex-end; font-size: 17px; font-weight: 600; color: #ffb020;">Apply</div>
    </div>

    <!-- preview of the order the choice produces, before committing to it -->
    <div style="padding: 0 16px 18px;">
      <div style="display: flex; gap: 5px;">
        <div style="flex: 1; height: 62px; border-radius: 9px; background: linear-gradient(150deg,#3b2a1d,#6b3b1c);"></div>

        <div style="flex: 1; height: 62px; border-radius: 9px; background: linear-gradient(150deg,#4a3220,#8a4a1e);"></div>
      </div>
      <div style="font-size: 12px; color: rgba(235,235,245,0.6); padding-top: 8px;">New order · 38 moments · 1:04</div>
    </div>

    <div style="padding: 0 16px;">
      <div style="font-size: 15px; font-weight: 600; padding-bottom: 9px;">Order by</div>
      <div style="background: #2c2c2e; border-radius: 14px; overflow: hidden;">

        <div style="display: flex; align-items: center; gap: 13px; padding: 13px 16px;">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ffb020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h7l4 10h5"/><path d="M4 17h7"/><path d="m17 4 3 3-3 3M17 14l3 3-3 3"/></svg>

            <div style="font-size: 17px;">Shuffle</div>
            <div style="font-size: 13px; color: rgba(235,235,245,0.6); margin-top: 1px;">Random order, reshuffles each tap</div>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
        </div>

        <div style="height: 0.5px; background: rgba(84,84,88,0.65); margin-left: 50px;"></div>

        <div style="display: flex; align-items: center; gap: 13px; padding: 13px 16px;">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="rgba(235,235,245,0.75)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16"/><path d="m3.5 16.5 3.5 3.5 3.5-3.5"/><path d="M14 6h7M14 11h5M14 16h3"/></svg>
          <div style="flex: 1;">
            <div style="font-size: 17px;">Oldest recorded first</div>
            <div style="font-size: 13px; color: rgba(235,235,245,0.6); margin-top: 1px;">Back to the order you filmed in</div>
          </div>
        </div>

        <div style="height: 0.5px; background: rgba(84,84,88,0.65); margin-left: 50px;"></div>

        <div style="display: flex; align-items: center; gap: 13px; padding: 13px 16px;">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="rgba(235,235,245,0.75)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20V4"/><path d="m3.5 7.5 3.5-3.5 3.5 3.5"/><path d="M14 6h3M14 11h5M14 16h7"/></svg>
          <div style="flex: 1;">
            <div style="font-size: 17px;">Newest recorded first</div>
            <div style="font-size: 13px; color: rgba(235,235,245,0.6); margin-top: 1px;">Most recent moment opens the video</div>
          </div>
        </div>

      </div>
      <div style="font-size: 13px; color: rgba(235,235,245,0.6); padding: 9px 2px 0; line-height: 1.35;">
        Reordering is undoable — the old order is kept until you leave the Glimpse.
      </div>
    </div>

  </div>

</div>
</x-dc>

</html>
