<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    a { color: #ffb020; } a:hover { color: #f0a01c; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #000; color: #fff; letter-spacing: -0.022em; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex: none; padding: 56px 16px 12px; display: flex; align-items: center;">
    <div style="width: 70px; min-height: 44px; display: flex; align-items: center; font-size: 17px; color: #ffb020;">Close</div>
    <div style="flex: 1; text-align: center;">
      <div style="font-size: 17px; font-weight: 600;">Moment 12</div>
      <div style="font-size: 12px; color: rgba(235,235,245,0.6);">of 38</div>
    </div>
    <div style="width: 70px; min-height: 44px; display: flex; align-items: center; justify-content: flex-end;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ffb020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="16" cy="8" r="2.2"/><circle cx="10" cy="16" r="2.2"/></svg>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; position: relative; display: grid; place-items: center; background: linear-gradient(150deg, #4a3220, #8a4a1e 55%, #2b1a0f);">
    <!-- step between clips without leaving: the whole point of clip preview -->
    <div style="position: absolute; left: 14px; width: 44px; height: 44px; border-radius: 22px; background: rgba(0,0,0,0.45); display: grid; place-items: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>
    </div>
    <div style="position: absolute; right: 14px; width: 44px; height: 44px; border-radius: 22px; background: rgba(0,0,0,0.45); display: grid; place-items: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5 16.5 12 9 19.5"/></svg>
    </div>

    <div style="position: absolute; top: 14px; left: 14px; display: flex; gap: 6px;">
      <div style="padding: 5px 10px; border-radius: 999px; background: rgba(0,0,0,0.55); font-size: 12px; font-weight: 600;">Back camera</div>
      <div style="padding: 5px 10px; border-radius: 999px; background: rgba(0,0,0,0.55); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;">0.6s</div>
    </div>
  </div>

  <div style="flex: none; padding: 16px 16px 34px;">
    <!-- trim window shown against the untrimmed clip, so you see what is cut -->
    <div style="height: 44px; border-radius: 10px; background: rgba(120,120,128,0.24); position: relative; overflow: hidden;">
      <div style="position: absolute; left: 18%; right: 26%; top: 0; bottom: 0; background: rgba(255,176,32,0.22); border-left: 3px solid #ffb020; border-right: 3px solid #ffb020;"></div>
      <div style="position: absolute; left: 34%; top: 0; bottom: 0; width: 2px; background: #fff;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: rgba(235,235,245,0.6); margin-top: 8px; font-variant-numeric: tabular-nums;">
      <span>0.20s</span><span>keeping 0.6s of 1.09s</span><span>0.80s</span>
    </div>

    <div style="display: flex; gap: 9px; margin-top: 18px;">
      <div style="flex: 1; height: 48px; border-radius: 13px; background: rgba(120,120,128,0.24); display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 15px; font-weight: 600; color: #ffb020;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffb020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.5"/><path d="m4 17 4.5-4.5a2 2 0 0 1 2.8 0L16 17"/></svg>
        Save frame
      </div>
      <div style="flex: 1; height: 48px; border-radius: 13px; background: rgba(120,120,128,0.24); display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 15px; font-weight: 600; color: #ffb020;">
        Edit
      </div>
      <div style="width: 56px; height: 48px; border-radius: 13px; background: rgba(120,120,128,0.24); display: grid; place-items: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#ff453a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/><path d="M6.5 7.5 7.3 19a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9L17.5 7.5"/></svg>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
